<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Ball</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div id="container_goku">

        
        <div class="estrutura">
            
            
            <img src="img/normal.png" id="imagem_n"></img>
            <img src="img/red.png"    id="imagem_red"></img>
            <img src="img/blue.png"   id="imagem_blue"></img>
            <img src="img/white.png"  id="imagem_white"></img>
            

        </div>

        
        <div class="estrutura_text">
        <h1 class="titulo_goku">GOKU</h1>
        </div>


        <div class="estrutura_bots">
        <button id="bot_n" onclick="padrao()"><img src="img/icone_normal.png" 
        alt="" width="80px" height="70px" style="margin-top: -5px;"></button>

        <button id="bot_r" onclick="vermelho()"><img src="img/icone_red.png" 
        alt="" width="80px" height="70px" style="margin-top: -5px;"></button>

        <button id="bot_b" onclick="azul()"><img src="img/icone_blue.png" 
        alt="" width="80px" height="70px" style="margin-top: -5px;"></button>

        <button id="bot_w" onclick="Instinto()"><img src="img/icone_white.png" 
        alt="" width="80px" height="70px" style="margin-top: -5px;"></button>
    </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
